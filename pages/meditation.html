<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css" />
    <title></title>
    <style>
      .play-pause-container {
        position: relative;
        width: 50px;
        height: 50px;
      }
      .play, .pause {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        transition: opacity 0.3s ease;
      }
      .pause {
        opacity: 0;
      }
      .playing .play {
        opacity: 0;
      }
      .playing .pause {
        opacity: 1;
      }
      
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Mindful Moments</h1>
        <p class="app-subtitle">In stillness, you meet your true self.</p>
      </header>
      

      <div class="vid-container">
        <video loop autoplay muted>
          <source src="../assets/video/beach.mp4" type="video/mp4">
        </video>
      </div>
      <div class="app-content">
        <div class="time-select">
          
          <button data-time="300" class="medium-mins">5 Minutes</button>
          <button data-time="600" class="long-mins">10 Minutes</button>
          <button data-time="900" class="extra-long-mins">15 Minutes</button>
          <button data-time="1200" class="short-mins">20 Minutes</button>
        </div>
      
        <div class="bottom-right-container">
      <div class="player-container">
        <audio class="song">
          <audio src="beach.mp3" autoplay></audio>
          <source src="../assets/sounds/beach.mp3" type="audio/mp3">
          <source src="../assets/sounds/rain.mp3" type="audio/mp3">
          <source src="../assets/sounds/healing-meditation-ringing-background-music-for-meditation-200223.mp3" type="audio/mp3">
          <source src="../assets/sounds/spiritual-meditation-30-mins-201945.mp3" type="audio/mp3">
          Your browser does not support the audio element.
        </audio>
        
        <div class="controls">
          <div class="circle-container">
            <svg class="track-outline" width="253" height="253" viewBox="0 0 453 453" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="126.5" cy="126.5" r="116.5" stroke="white" stroke-width="10"/>
            </svg>
            <svg class="moving-outline" width="253" height="253" viewBox="0 0 453 453" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="126.5" cy="126.5" r="116.5" stroke="#018EBA" stroke-width="10"/>
            </svg>
        
            <div class="play-pause-container">
              <img src="../assets/images/play.svg" class="play" alt="Play button">
              <img src="../assets/images/pause.svg" class="pause" alt="Pause button">
            </div>
          </div>
          
          <img src="../assets/images/replay.svg" class="replay" alt="Replay button">
        </div>
        
        
        <h3 class="time-display">0:00</h3>
      </div>
      
      <div class="sound-picker">
      
        <button data-sound="../assets/sounds/beach.mp3" data-video="../assets/video/beach.mp4">
          <img src="../assets/images/ocean.png" alt="Beach sound">
          <span>Ocean</span>
        </button>
        <button data-sound="../assets/sounds/healing-meditation-ringing-background-music-for-meditation-200223.mp3" data-video="../assets/video/bell.mp4">
          <img src="../assets/images/Meditation bell.png" alt="Meditation bells">
          <span>Bells</span>
        <button data-sound="../assets/sounds/rain.mp3" data-video="../assets/video/rain.mp4">
          <img src="../assets/images/rain.png" alt="Rain sound">
          <span>Rain</span>
        </button>
        
        </button>
        <button data-sound="../assets/sounds/spiritual-meditation-30-mins-201945.mp3" data-video="../assets/video/om.mp4">
          <img src="../assets/images/om.png" alt="Om meditation">
          <span>Om</span>
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="../js/meditation.js"></script>
    <script>
      // Add this to your meditation.js file or include it here
      document.addEventListener('DOMContentLoaded', function() {
        const playPauseContainer = document.querySelector('.play-pause-container');
        const playBtn = document.querySelector('.play');
        const pauseBtn = document.querySelector('.pause');
        const audio = document.querySelector('.song');
        
        // Toggle play/pause
        playPauseContainer.addEventListener('click', function() {
          if (audio.paused) {
            audio.play();
            playPauseContainer.classList.add('playing');
          } else {
            audio.pause();
            playPauseContainer.classList.remove('playing');
          }
        });
        
        // Update button state when audio ends
        audio.addEventListener('ended', function() {
          playPauseContainer.classList.remove('playing');
        });
      });
    </script>
  </body>
</html>
