<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In / Sign Up</title>
    <link rel="stylesheet" href="../styles/sign.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-html">
        <!-- Tab navigation -->
        <input
          id="tab-1"
          type="radio"
          name="tab"
          class="sign-in"
          checked
        /><label for="tab-1" class="tab">Sign In</label>
        <input id="tab-2" type="radio" name="tab" class="sign-up" /><label
          for="tab-2"
          class="tab"
          >Sign Up</label
        >

        <div class="login-form">
          <!-- Sign In Form -->
          <div class="sign-in-htm">
            <div class="group">
              <label for="signin-email" class="label">Email Address</label>
              <input id="signin-email" type="email" class="input" required />
            </div>
            <div class="group">
              <label for="signin-password" class="label">Password</label>
              <input
                id="signin-password"
                type="password"
                class="input"
                data-type="password"
                required
              />
            </div>
            <div class="group">
              <input
                id="signin-remember"
                type="checkbox"
                class="check"
                checked
              />
              <label for="signin-remember"
                ><span class="icon"></span> Keep me Signed in</label
              >
            </div>
            <div class="group">
              <input
                type="submit"
                class="button"
                value="Sign In"
                id="signin-btn"
              />
            </div>
            <div class="hr"></div>
            <div class="foot-lnk">
              <a href="#">Forgot Password?</a>
            </div>
          </div>

          <!-- Sign Up Form -->
          <div class="sign-up-htm">
            <div class="group">
              <label for="signup-name" class="label">Name</label>
              <input id="signup-name" type="text" class="input" required />
            </div>
            <div class="group">
              <label for="signup-email" class="label">Email Address</label>
              <input id="signup-email" type="email" class="input" required />
            </div>
            <div class="group">
              <label for="signup-password" class="label">Password</label>
              <input
                id="signup-password"
                type="password"
                class="input"
                data-type="password"
                required
              />
            </div>
            <div class="group">
              <label for="repeat-password" class="label">Repeat Password</label>
              <input
                id="repeat-password"
                type="password"
                class="input"
                data-type="password"
                required
              />
            </div>
            <div class="group">
              <input
                type="submit"
                class="button"
                value="Sign Up"
                id="signup-btn"
              />
            </div>
            <div class="hr"></div>
            <div class="foot-lnk">
              <label for="tab-1">Already a member? Sign In</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Sign In Button Click Event
      const backendURL = "https://paatashala-backend.onrender.com";
      document
        .getElementById("signin-btn")
        .addEventListener("click", function (event) {
          event.preventDefault();

          const email = document.getElementById("signin-email").value;
          const password = document.getElementById("signin-password").value;
          const rememberMe = document.getElementById("signin-remember").checked;

          const payload = {
            email: email,
            password: password,
          };

          fetch(`${backendURL}/api/auth/pages/signin`, {
            // Sign In API endpoint
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                alert("Login successful");
                localStorage.setItem("token", data.token); // Store token if needed
                window.location.href = "/index.html"; // Redirect to dashboard
              } else {
                alert("Invalid email or password");
              }
            })
            .catch((error) => {
              alert("An error occurred. Please try again.");
            });
        });

      // Sign Up Button Click Event
      document
        .getElementById("signup-btn")
        .addEventListener("click", function (event) {
          event.preventDefault();

          const name = document.getElementById("signup-name").value;
          const email = document.getElementById("signup-email").value;
          const password = document.getElementById("signup-password").value;
          const repeatPassword =
            document.getElementById("repeat-password").value;

          if (password !== repeatPassword) {
            alert("Passwords do not match.");
            return;
          }

          const payload = {
            name: name,
            email: email,
            password: password,
            confirmPassword: repeatPassword,
          };

          fetch(`${backendURL}/api/auth/pages/signin`, {
            // Sign Up API endpoint
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                alert("Sign-up successful");
                window.location.href = "/index.html"; // Redirect to login page after successful sign-up
              } else {
                alert("Sign-up failed. Please try again.");
              }
            })
            .catch((error) => {
              alert("An error occurred. Please try again.");
            });
        });
    </script>
  </body>
</html>
