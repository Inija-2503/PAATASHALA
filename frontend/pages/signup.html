<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="../styles/sign.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-html">
        <label class="tab">Sign Up</label>
        <div class="login-form">
          <form action="/register" method="POST" class="sign-up-htm">
            <div class="group">
              <label for="user" class="label">Username</label>
              <input
                id="user"
                name="username"
                type="text"
                class="input"
                required
              />
            </div>
            <div class="group">
              <label for="pass" class="label">Password</label>
              <input
                id="pass"
                name="password"
                type="password"
                class="input"
                required
              />
            </div>
            <div class="group">
              <label for="repeat-pass" class="label">Repeat Password</label>
              <input
                id="repeat-pass"
                name="confirmPassword"
                type="password"
                class="input"
                required
              />
            </div>
            <div class="group">
              <label for="email" class="label">Email Address</label>
              <input
                id="email"
                name="email"
                type="email"
                class="input"
                required
              />
            </div>
            <div class="group">
              <input type="submit" class="button" value="Sign Up" />
            </div>
            <div class="hr"></div>
            <div class="foot-lnk">
              <a href="./sign-in.html">Already a member? Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
