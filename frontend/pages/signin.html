<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="../styles/sign.css" />
    <title>Sign In</title>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-html">
        <label class="tab">Sign In</label>
        <div class="login-form">
          <form action="../pages/signin.html" method="POST" class="sign-in-htm">
            <div class="group">
              <label for="user" class="label">Username</label>
              <input
                id="user"
                name="username"
                type="text"
                class="input"
                required
              />
            </div>
            <div class="group">
              <label for="pass" class="label">Password</label>
              <input
                id="pass"
                name="password"
                type="password"
                class="input"
                required
              />
            </div>
            <div class="group">
              <input id="check" type="checkbox" class="check" checked />
              <label for="check"
                ><span class="icon"></span> Keep me Signed in</label
              >
            </div>
            <div class="group">
              <input type="submit" class="button" value="Sign In" />
            </div>
            <div class="hr"></div>
            <div class="foot-lnk">
              <a href="./sign-up.html">Don't have an account? Sign Up</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
